<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Fotografar Pix · Jovens Sagrados</title>
<style>
:root{font:16px 'Segoe UI',sans-serif;color:#28252b;background:#f7f5f1}*{box-sizing:border-box}body{margin:0}header{padding:24px;background:white;border-bottom:1px solid #e5e0da}header p{color:#822c3c;font-size:12px;font-weight:700;letter-spacing:1px}h1{font-size:25px;margin:8px 0}h2{font-size:21px;margin:0}p{line-height:1.5}main{max-width:600px;margin:auto;padding:20px}.muted{color:#746e72;font-size:14px}.card{padding:20px;margin:14px 0;background:white;border:1px solid #e5e0da;border-radius:16px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}button,.camera{font:600 16px 'Segoe UI',sans-serif;display:block;text-align:center;padding:16px;border-radius:11px;border:1px solid #e5e0da;background:white;color:#28252b;cursor:pointer}.camera{background:#822c3c;color:white;margin-top:18px;width:100%}button:disabled{opacity:.5}#status{padding:14px;background:#fff8e8;border-radius:10px}#capture[hidden], [hidden]{display:none!important}#preview{display:block;max-width:100%;max-height:50vh;margin:18px auto;border-radius:10px}#send{background:#24684e;color:white;width:100%;margin:12px 0}.ok{color:#24684e}footer{font-size:12px;color:#746e72;text-align:center;padding:20px}a{color:#822c3c}
</style></head><body><header><p>JOVENS SAGRADOS · COMPROVANTES</p><h1 id="title">Celular do caixa</h1><div class="muted">Fotografe o comprovante mostrado pelo cliente.</div></header><main><p id="status" role="status" aria-live="polite">Conectando…</p><section id="capture" class="card" hidden><h2 id="captureTitle"></h2><p id="captureDetails" class="muted"></p><img id="preview" alt="Foto do comprovante" hidden><button id="send" hidden>Enviar foto</button><button id="retake" class="camera">Tirar outra foto</button><button id="cancel" style="margin-top:12px">Voltar aos pedidos</button></section><section id="orders" aria-label="Pedidos aguardando foto"></section><button id="refresh">Atualizar pedidos</button><input id="camera" type="file" accept="image/*" capture="environment" hidden></main><footer>A foto fica vinculada ao pedido. Confira o Pix no banco antes de confirmar a venda.</footer><script src="/comprovante-phone.js"></script></body></html>
