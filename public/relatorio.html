<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatório - Jovens Sagrados</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5f1;color:#28252b;font:14px 'Segoe UI',sans-serif}.toolbar{max-width:1000px;margin:20px auto;display:flex;gap:12px;padding:0 20px;align-items:center;flex-wrap:wrap}button,a{font:inherit}button,.back{border:1px solid #d7d0cb;border-radius:8px;padding:12px 16px;cursor:pointer;background:white;color:#28252b;text-decoration:none}button.primary{background:#822c3c;color:white;border-color:#822c3c}button:disabled{opacity:.5}main{max-width:1000px;margin:20px auto;background:white;padding:36px;border:1px solid #ddd;border-radius:12px}header{border-bottom:2px solid #822c3c;padding-bottom:20px}h1{font-size:26px;margin:4px 0 12px}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 10px}p{line-height:1.5;margin:6px 0}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#822c3c;font-weight:700}.muted{color:#746e72;font-size:12px}section{margin-top:24px}table{border-collapse:collapse;table-layout:fixed;width:100%;font-size:12px}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid #ddd;vertical-align:top;overflow-wrap:anywhere}th{background:#f4efed;font-size:11px}.grand-total{font-size:28px;font-weight:700;color:#24684e}footer{margin-top:45px;font-size:12px}#message{max-width:960px;margin:12px auto;padding:0 20px;color:#822c3c}#message:empty{display:none}@media(max-width:600px){main{margin:10px;padding:18px}th,td{padding:6px 4px;font-size:10px}.toolbar{padding:0 10px}h1{font-size:22px}}@media print{@page{size:A4;margin:12mm}body{background:white;font-size:10px}.toolbar,#message{display:none!important}main{max-width:none;margin:0;border:0;border-radius:0;padding:0}header{padding-bottom:12px}h1{font-size:20px}h2{font-size:15px}h3{font-size:12px;break-after:avoid}table{font-size:9px}th,td{font-size:9px;padding:6px 4px}thead{display:table-header-group}tr{break-inside:avoid}.grand-total{font-size:22px}footer{break-inside:avoid}}
